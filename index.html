<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scan Subread</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="topbar">
      <button id="menu" aria-controls="panel" aria-expanded="false">Menu</button>
      <button id="prev">Prev</button>
      <span id="page-label">No PDF</span>
      <button id="next">Next</button>
    </header>

    <aside id="panel">
      <h1>Scan Subread</h1>
      <p class="hint">Load a scanned PDF, run OCR, then tap a word on the page to look it up.</p>

      <label>PDF (scanned) <input id="pdf-file" type="file" accept="application/pdf" /></label>
      <label
        >OCR language
        <select id="lang">
          <option value="eng">English (eng)</option>
          <option value="jpn">Japanese, horizontal (jpn)</option>
          <option value="jpn_vert">Japanese, vertical (jpn_vert)</option>
          <option value="jpn+eng">Japanese + English</option>
        </select>
      </label>
      <label>Pages to OCR <input id="max-pages" type="number" min="1" value="3" /></label>
      <button id="run" disabled>OCR</button>
      <div id="status" aria-live="polite"></div>
      <progress id="progress" max="1" value="0" hidden></progress>

      <label
        >Dictionaries (Yomitan zip)
        <input id="dict-file" type="file" accept=".zip,application/zip" multiple />
      </label>
      <ul id="dicts"></ul>

      <section id="local-audio">
        <h2>Local audio (android.db)</h2>
        <div id="la-status" class="hint">Local audio: checking...</div>
        <div class="row">
          <button id="la-import" disabled>Import</button>
          <button id="la-remove" disabled>Remove</button>
        </div>
        <progress id="la-progress" max="1" value="0" hidden></progress>
        <p class="hint">
          Or copy the file by hand to
          <code>Android/data/com.equwal.scansubread/files/android.db</code>.
        </p>
      </section>

      <label>Audio (optional) <input id="audio-file" type="file" accept="audio/*" /></label>
      <label
        >Subtitles (optional) <input id="sub-file" type="file" accept=".srt,.vtt,text/*"
      /></label>
      <audio id="audio" controls></audio>

      <ol id="cues"></ol>
    </aside>

    <main id="main">
      <div id="viewer">
        <div id="page">
          <div id="overlay"></div>
        </div>
      </div>
    </main>

    <div id="popup" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
