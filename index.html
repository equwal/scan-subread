<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scan Subread</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="topbar">
      <button id="menu" aria-controls="panel" aria-expanded="false">Menu</button>
      <button id="prev">Prev</button>
      <span id="page-label">No PDF</span>
      <button id="next">Next</button>
    </header>

    <aside id="panel">
      <h1>Scan Subread</h1>
      <p class="hint">Load a scanned PDF, run OCR, then tap a word on the page.</p>

      <label>PDF (scanned) <input id="pdf-file" type="file" accept="application/pdf" /></label>
      <label
        >OCR language
        <select id="lang">
          <option value="eng">English (eng)</option>
          <option value="jpn">Japanese, horizontal (jpn)</option>
          <option value="jpn_vert">Japanese, vertical (jpn_vert)</option>
          <option value="jpn+eng">Japanese + English</option>
        </select>
      </label>
      <label>Pages to OCR <input id="max-pages" type="number" min="1" value="3" /></label>
      <button id="run" disabled>OCR</button>
      <div id="status" aria-live="polite"></div>
      <progress id="progress" max="1" value="0" hidden></progress>

      <section id="audiobook">
        <h2>Audiobook</h2>
        <label>Audio (optional) <input id="audio-file" type="file" accept="audio/*" /></label>
        <label
          >Subtitles (optional) <input id="sub-file" type="file" accept=".srt,.vtt,text/*"
        /></label>
        <audio id="audio" controls></audio>
      </section>

      <ol id="cues"></ol>
    </aside>

    <main id="main">
      <div id="viewer">
        <div id="page">
          <div id="overlay"></div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
